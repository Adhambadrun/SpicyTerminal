[build]
  command = "npm run build"
  publish = "public"

# The build emits self-contained app pages into public/ so deploys ship only
# the app — never the repo's screenshots and source files. The Seat Map page is
# served at /seatmap via the rewrite below; include seatmap.html when deploying
# with Netlify Drop.

# Keep the public URL short while serving the generated static Seat Map page.
[[redirects]]
  from = "/seatmap"
  to = "/seatmap.html"
  status = 200

# The fare backend behind the Seat Map PRICE button:
#   /api/flights/price  -> api/flights/price.js   (a live fare, or no_fare)
#   /healthz            -> api/healthz.js         (the probe that gates the
#                                                   PRICE block on the page)
[functions]
  directory = "api"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/flights/price"
  to = "/.netlify/functions/flights/price"
  status = 200

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/healthz"
  status = 200

# /version.json is the tiny file an open tab polls to learn that a newer build
# is live (the "NEW VERSION LIVE · REFRESH" notice). It must never be served
# from a cache, or a tab would keep hearing yesterday's build id.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# The app pages carry the other half of that stamp (window.SPICY_BUILD_ID), so
# they are pinned for the same reason: a page answered from a cache keeps
# running yesterday's build, the notice fires, and REFRESH appears to do
# nothing. no-cache rather than no-store because the page is 2.4 MB — a
# revalidation costs a 304, a re-download costs the whole artifact.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# /seatmap is the rewrite above and therefore its own request path; /*.html
# does not match it.
[[headers]]
  for = "/seatmap"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
